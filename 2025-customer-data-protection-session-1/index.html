<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2025년 고객 데이터 보호 및 안전한 처리교육 1회차 교육 문서</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">1회차 교육 문서</p>
      <h1>2025년 고객 데이터 보호 및 안전한 처리교육 1회차</h1>
    </div>
    <nav class="actions" aria-label="자료 다운로드">
      <a href="./source.pdf" download>PDF</a>
    </nav>
  </header>

  <main class="viewer">
    <section class="page-frame" aria-live="polite">
      <img id="pageImage" src="./pages/page-01.png" alt="문서 1페이지">
    </section>

    <section class="controls" aria-label="페이지 제어">
      <button id="prevButton" type="button" aria-label="이전 페이지">
        <span aria-hidden="true">&lsaquo;</span>
      </button>
      <div class="status">
        <strong id="pageNumber">1</strong>
        <span>/</span>
        <span id="pageTotal">24</span>
      </div>
      <button id="nextButton" type="button" aria-label="다음 페이지">
        <span aria-hidden="true">&rsaquo;</span>
      </button>
    </section>

    <section class="thumbs" id="thumbs" aria-label="페이지 목록"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026년 고객 데이터 보호 및 안전한 처리교육 자료</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --ink: #20242a;
      --muted: #667085;
      --line: #d8ded2;
      --accent: #1d6f5f;
      --paper: #ffffff;
      --shadow: 0 16px 36px rgba(22, 35, 35, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      max-width: 760px;
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.14;
      letter-spacing: 0;
    }

    .intro {
      max-width: 760px;
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .materials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .material {
      display: flex;
      flex-direction: column;
      min-height: 220px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: inherit;
      background: var(--paper);
      box-shadow: var(--shadow);
      text-decoration: none;
    }

    .material:hover,
    .material:focus-visible {
      border-color: var(--accent);
    }

    .session {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.28;
      letter-spacing: 0;
    }

    .meta {
      margin: auto 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Seminar Materials</p>
    <h1>2026년 고객 데이터 보호 및 안전한 처리교육 자료</h1>
    <p class="intro">공개 가능한 교육 회차별 문서를 웹에서 바로 볼 수 있도록 정리한 자료실입니다.</p>

    <section class="materials" aria-label="교육 자료 목록">
      <a class="material" href="./2026-customer-data-protection-session-1/">
        <p class="session">1회차 · 공개용</p>
        <h2>2026년 고객 데이터 보호 및 안전한 처리교육 1회차 교육 문서</h2>
        <p class="meta">공개 부적합 정보를 제거한 데이터 손실 방지 운영 매뉴얼 요약본</p>
      </a>

      <a class="material" href="./2026-customer-data-protection-session-2/">
        <p class="session">2회차</p>
        <h2>2026년 고객 데이터 보호 및 안전한 처리교육 2회차 교육 문서</h2>
        <p class="meta">슬라이드 교육 자료 · PPT/PDF 다운로드 포함</p>
      </a>
    </section>
  </main>
</body>
</html>
